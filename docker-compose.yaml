version: '3.8'

services:
  postgres_db:
    image: postgres:15
    container_name: ecommerce_dwh
    environment:
      POSTGRES_USER: ecommerce_user
      POSTGRES_PASSWORD: ecommerce_password
      POSTGRES_DB: ecommerce_db
    ports:
      - "5432:5432"
      
    volumes:
      - postgres_data:/var/lib/postgresql/data

  airflow_spark:
    build: .  
    container_name: airflow_ecommerce
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - DWH_HOST=postgres_db
      - DWH_PORT=5432
      - DWH_USER=ecommerce_user
      - DWH_PASSWORD=ecommerce_password
      - DWH_DB=ecommerce_db
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags   
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
    command: airflow standalone    
    depends_on:
      - postgres_db 
volumes:
  postgres_data: